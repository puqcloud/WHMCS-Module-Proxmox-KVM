<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16122e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0f19;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Top Line Gradient (Proxmox Violet) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:1" />
    </linearGradient>

    <!-- Rack Enclosure Gradient -->
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065;stop-opacity:0.65" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.85" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#6c3ce0;stop-opacity:0.1" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#241b42" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>

  <!-- Accent Line Top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Ambient Glow Behind Hypervisor Illustration -->
  <circle cx="180" cy="150" r="120" fill="#6c3ce0" opacity="0.18" />
  <circle cx="180" cy="150" r="80" fill="#8b5cf6" opacity="0.16" />

  <!-- ======================================================== -->
  <!-- LEFT: Proxmox KVM Virtualization Cluster Illustration     -->
  <!-- ======================================================== -->
  <g transform="translate(180, 150) scale(0.95)">
    <!-- Server Enclosure Frame -->
    <rect x="-105" y="-72" width="210" height="144" rx="8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Blade Server 1 (Host Node) -->
    <g transform="translate(0, -48)">
      <rect x="-95" y="-17" width="190" height="34" rx="5" fill="url(#rackGrad)" stroke="#8b5cf6" stroke-width="2.5"/>
      <rect x="-93" y="-14" width="6" height="28" rx="1" fill="#475569"/>
      <rect x="87" y="-14" width="6" height="28" rx="1" fill="#475569"/>
      <circle cx="-72" cy="0" r="4" fill="#22c55e"/>
      <circle cx="-60" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="-48" cy="0" r="4" fill="#a78bfa" opacity="0.8"/>
      <rect x="-32" y="-7" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="-32" y="3" width="45" height="4" rx="2" fill="#64748b" opacity="0.4"/>
      <rect x="38" y="-9" width="40" height="18" rx="3" fill="#6c3ce0" opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
      <text x="58" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd" text-anchor="middle">HOST</text>
    </g>

    <!-- Blade Server 2 (KVM VM 1) -->
    <g transform="translate(0, -5)">
      <rect x="-95" y="-17" width="190" height="34" rx="5" fill="url(#rackGrad)" stroke="#6c3ce0" stroke-width="2.5"/>
      <rect x="-93" y="-14" width="6" height="28" rx="1" fill="#475569"/>
      <rect x="87" y="-14" width="6" height="28" rx="1" fill="#475569"/>
      <circle cx="-72" cy="0" r="4" fill="#22c55e"/>
      <circle cx="-60" cy="0" r="4" fill="#a78bfa"/>
      <circle cx="-48" cy="0" r="4" fill="#6c3ce0" opacity="0.8"/>
      <rect x="-32" y="-7" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="-32" y="3" width="52" height="4" rx="2" fill="#64748b" opacity="0.4"/>
      <rect x="38" y="-9" width="40" height="18" rx="3" fill="#6c3ce0" opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
      <text x="58" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd" text-anchor="middle">KVM 1</text>
    </g>

    <!-- Blade Server 3 (KVM VM 2) -->
    <g transform="translate(0, 38)">
      <rect x="-95" y="-17" width="190" height="34" rx="5" fill="url(#rackGrad)" stroke="#8b5cf6" stroke-width="2.5"/>
      <rect x="-93" y="-14" width="6" height="28" rx="1" fill="#475569"/>
      <rect x="87" y="-14" width="6" height="28" rx="1" fill="#475569"/>
      <circle cx="-72" cy="0" r="4" fill="#22c55e"/>
      <circle cx="-60" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="-48" cy="0" r="4" fill="#a78bfa" opacity="0.8"/>
      <rect x="-32" y="-7" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="-32" y="3" width="38" height="4" rx="2" fill="#64748b" opacity="0.4"/>
      <rect x="38" y="-9" width="40" height="18" rx="3" fill="#6c3ce0" opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
      <text x="58" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd" text-anchor="middle">KVM 2</text>
    </g>

    <!-- Floating Shield (Security & Firewall Protection Badge) -->
    <g transform="translate(108, -12)">
      <path d="M18,0 L36,7 L36,22 C36,36 28,45 18,50 C8,45 0,36 0,22 L0,7 Z"
            fill="url(#shieldGrad)" stroke="#8b5cf6" stroke-width="2"/>
      <polyline points="10,24 16,30 27,16" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Network Interconnect Nodes on Left -->
    <g transform="translate(-108, -10)">
      <circle cx="0" cy="-28" r="4" fill="#16122e" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="0" y1="-24" x2="0" y2="4" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
      <circle cx="0" cy="8" r="5" fill="#8b5cf6"/>
      <line x1="0" y1="13" x2="0" y2="40" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
      <circle cx="0" cy="44" r="4" fill="#16122e" stroke="#8b5cf6" stroke-width="2"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER: Typography & Features                            -->
  <!-- ======================================================== -->
  <g transform="translate(360, 0)">
    <!-- Subtitle Category Tag -->
    <text x="0" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#8b5cf6" letter-spacing="3">WHMCS SERVER MODULE</text>

    <!-- Main Module Title -->
    <text x="0" y="132" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="2">PROXMOX KVM</text>

    <!-- Gradient Divider -->
    <rect x="0" y="152" width="500" height="4" fill="url(#accent)" rx="2"/>

    <!-- Feature 1 -->
    <g transform="translate(0, 188)">
      <circle cx="7" cy="-5" r="4" fill="#8b5cf6"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Automated KVM VM Provisioning, Cloud-Init Templates &amp; Full Control</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 218)">
      <circle cx="7" cy="-5" r="4" fill="#8b5cf6"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Embedded noVNC HTML5 Console &amp; Real-Time Resource Telemetry</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 248)">
      <circle cx="7" cy="-5" r="4" fill="#8b5cf6"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Automated Snapshots, Backup Schedules, IP Pools &amp; Firewall Protection</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT: PUQ Software Branding & Badge                     -->
  <!-- ======================================================== -->
  <line x1="940" y1="50" x2="940" y2="250" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <g transform="translate(970, 0)">
    <!-- PUQ Software Logo Group -->
    <g transform="translate(95, 95)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#8b5cf6" text-anchor="middle">PUQ</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">SOFTWARE</text>
    </g>

    <!-- Official Integration Badge -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="24" cy="21" r="9" fill="#6c3ce0"/>
      <polyline points="20,21 23,24 29,18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c4b5fd" letter-spacing="1">MARKETPLACE</text>
    </g>
  </g>
</svg>
