<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#6c3ce0;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="500" height="8" fill="url(#accent)"/>

  <!-- Ambient Glow behind Server Node -->
  <circle cx="250" cy="132" r="95" fill="#6c3ce0" opacity="0.14" />
  <circle cx="250" cy="132" r="65" fill="#8b5cf6" opacity="0.16" />

  <!-- Central Proxmox KVM Virtualization Graphic (Centered at X=250, Y=132) -->
  <g transform="translate(250, 132)">
    <!-- Server Enclosure / Rack Chassis Frame -->
    <rect x="-105" y="-72" width="210" height="144" rx="8" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>

    <!-- Blade Server 1 (Top / Host Node) -->
    <g transform="translate(0, -48)">
      <rect x="-95" y="-17" width="190" height="34" rx="5" fill="url(#rackGrad)" stroke="#8b5cf6" stroke-width="2.5"/>
      <!-- Rack Ear Mounts -->
      <rect x="-93" y="-14" width="6" height="28" rx="1" fill="#4a5568"/>
      <rect x="87" y="-14" width="6" height="28" rx="1" fill="#4a5568"/>
      <!-- Status LEDs -->
      <circle cx="-72" cy="0" r="4" fill="#22c55e"/>
      <circle cx="-60" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="-48" cy="0" r="4" fill="#a78bfa" opacity="0.8"/>
      <!-- Drive / Ventilation Slots -->
      <rect x="-32" y="-7" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="-32" y="3" width="45" height="4" rx="2" fill="#64748b" opacity="0.4"/>
      <!-- Node Chip / Hypervisor Badge -->
      <rect x="38" y="-9" width="40" height="18" rx="3" fill="#6c3ce0" opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
      <text x="58" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd" text-anchor="middle">HOST</text>
    </g>

    <!-- Blade Server 2 (Middle / KVM VM Instance 1) -->
    <g transform="translate(0, -5)">
      <rect x="-95" y="-17" width="190" height="34" rx="5" fill="url(#rackGrad)" stroke="#6c3ce0" stroke-width="2.5"/>
      <!-- Rack Ear Mounts -->
      <rect x="-93" y="-14" width="6" height="28" rx="1" fill="#4a5568"/>
      <rect x="87" y="-14" width="6" height="28" rx="1" fill="#4a5568"/>
      <!-- Status LEDs -->
      <circle cx="-72" cy="0" r="4" fill="#22c55e"/>
      <circle cx="-60" cy="0" r="4" fill="#a78bfa"/>
      <circle cx="-48" cy="0" r="4" fill="#6c3ce0" opacity="0.8"/>
      <!-- Drive Slots -->
      <rect x="-32" y="-7" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="-32" y="3" width="52" height="4" rx="2" fill="#64748b" opacity="0.4"/>
      <!-- VM 100 Badge -->
      <rect x="38" y="-9" width="40" height="18" rx="3" fill="#6c3ce0" opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
      <text x="58" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd" text-anchor="middle">KVM 1</text>
    </g>

    <!-- Blade Server 3 (Bottom / KVM VM Instance 2) -->
    <g transform="translate(0, 38)">
      <rect x="-95" y="-17" width="190" height="34" rx="5" fill="url(#rackGrad)" stroke="#8b5cf6" stroke-width="2.5"/>
      <!-- Rack Ear Mounts -->
      <rect x="-93" y="-14" width="6" height="28" rx="1" fill="#4a5568"/>
      <rect x="87" y="-14" width="6" height="28" rx="1" fill="#4a5568"/>
      <!-- Status LEDs -->
      <circle cx="-72" cy="0" r="4" fill="#22c55e"/>
      <circle cx="-60" cy="0" r="4" fill="#38bdf8"/>
      <circle cx="-48" cy="0" r="4" fill="#a78bfa" opacity="0.8"/>
      <!-- Drive Slots -->
      <rect x="-32" y="-7" width="60" height="4" rx="2" fill="#64748b" opacity="0.6"/>
      <rect x="-32" y="3" width="38" height="4" rx="2" fill="#64748b" opacity="0.4"/>
      <!-- VM 101 Badge -->
      <rect x="38" y="-9" width="40" height="18" rx="3" fill="#6c3ce0" opacity="0.4" stroke="#8b5cf6" stroke-width="1"/>
      <text x="58" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c4b5fd" text-anchor="middle">KVM 2</text>
    </g>

    <!-- Floating Shield (Security & Firewall Protection Badge) -->
    <g transform="translate(108, -12)">
      <path d="M18,0 L36,7 L36,22 C36,36 28,45 18,50 C8,45 0,36 0,22 L0,7 Z"
            fill="url(#shieldGrad)" stroke="#8b5cf6" stroke-width="2"/>
      <polyline points="10,24 16,30 27,16" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Network Interconnect Nodes on Left -->
    <g transform="translate(-108, -10)">
      <circle cx="0" cy="-28" r="4" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="0" y1="-24" x2="0" y2="4" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
      <circle cx="0" cy="8" r="5" fill="#8b5cf6"/>
      <line x1="0" y1="13" x2="0" y2="40" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>
      <circle cx="0" cy="44" r="4" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="2"/>
    </g>
  </g>

  <!-- Module Name (Big & Readable, Spanning Edge-to-Edge) -->
  <text x="250" y="280" font-family="Arial, sans-serif" font-size="62" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">PROXMOX KVM</text>

  <!-- Subtitle (Larger & Prominent) -->
  <text x="250" y="336" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">WHMCS SERVER MODULE</text>

  <!-- Separator -->
  <rect x="150" y="362" width="200" height="4" fill="#6c3ce0" rx="2"/>

  <!-- PUQ Software Branding (Enlarged & Centered) -->
  <g transform="translate(155, 405)">
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6c3ce0">PUQ</text>
    <text x="92" y="28" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Software</text>
  </g>
</svg>
